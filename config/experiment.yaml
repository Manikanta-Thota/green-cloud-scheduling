# Frozen experiment definition (proposal Sections 3.1, 3.4, 3.5).
# Change values here only through a documented protocol revision.
experiment:
  name: hpeas-green-cloud-v0
  master_seed: 20261018        # all instance and algorithm seeds derive from this
  replications: 30             # independent seeds per algorithm x scenario (proposal: at least 30)

algorithms:                    # proposal Section 3.1 comparison methods
  - fcfs
  - minmin
  - single_metaheuristic       # TBD: choice of algorithm (see docs/protocol.md, open decision D1)
  - multiobjective_baseline    # TBD: choice of algorithm (open decision D2)
  - hpeas

scenario_factors:              # proposal Section 3.1 table (full factorial = 81 scenarios)
  tasks: [500, 2000, 5000]
  vms: [20, 50, 100]
  heterogeneity: [low, medium, high]
  arrival: [steady, bursty, workflow]   # workflow generator not implemented yet

fixed_parameters:              # PLACEHOLDER values; replace with documented sources in M1
  datacentre_load: 0.7         # offered load as a fraction of total MIPS capacity
  vms_per_host: 4
  host_p_idle_w: 100.0
  host_p_max_w: 250.0
  vm_price_per_mips_second: 5.0e-7
  task_length_mean_mi: 50000
  task_length_sigma: 0.8       # lognormal sigma
  deadline_slack_range: [3.0, 10.0]   # deadline = arrival + k * length / mean_vm_mips
  heterogeneity_mips_range:
    low: [900, 1100]
    medium: [500, 1500]
    high: [250, 2500]

decision_rules:                # proposal Section 3.5
  max_makespan_degradation: 0.05     # median makespan, relative to best baseline
  max_cost_increase: 0.05
  max_sla_increase_pp: 1.0           # percentage points
  alpha: 0.05
  bootstrap_resamples: 10000
